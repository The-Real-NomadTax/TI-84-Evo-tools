[package]
name = "ti-evo-tools"
version = "0.1.0"
edition = "2024"
authors = ["NomadTax"]
license = "MIT"
readme = "README.md"
description = "A small native Qt Quick Controls screen-capture client for TI calculators"
publish = false

[dependencies]
cxx = "1.0"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rusb = "0.9.4"

[build-dependencies]
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }

[patch.crates-io]
qt-build-utils = { path = "vendor/qt-build-utils" }
